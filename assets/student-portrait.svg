<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 286" role="img" aria-labelledby="portrait-title">
  <title id="portrait-title">تصویر دانشجوی نمونه</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9e6e1"/>
      <stop offset="1" stop-color="#cdd0d2"/>
    </linearGradient>
    <linearGradient id="hijab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#242328"/>
      <stop offset=".48" stop-color="#111116"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="skin" x1=".2" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#efc8ac"/>
      <stop offset=".46" stop-color="#dcaa89"/>
      <stop offset="1" stop-color="#c78f70"/>
    </linearGradient>
    <linearGradient id="neck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c69275"/>
      <stop offset="1" stop-color="#ab755e"/>
    </linearGradient>
    <radialGradient id="cheek" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#d17e72" stop-opacity=".42"/>
      <stop offset="1" stop-color="#d17e72" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9e5e5b"/>
      <stop offset="1" stop-color="#7d4444"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="tiny-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <rect width="220" height="286" fill="url(#bg)"/>
  <ellipse cx="110" cy="158" rx="85" ry="125" fill="#f6f2ec" opacity=".22"/>

  <!-- shoulders and outer headscarf -->
  <path d="M-8 286c4-58 31-104 76-119 42-14 103-7 136 31 18 21 27 51 31 88H-8Z" fill="url(#hijab)"/>
  <path d="M43 286c3-47 20-83 60-101 34-16 77-14 109 10 23 17 36 49 41 91H43Z" fill="#0b0a0e"/>
  <path d="M57 286c4-45 19-76 50-93 31-18 72-15 102 7 22 16 35 46 40 86H57Z" fill="#17161b"/>

  <!-- headscarf crown and side drape -->
  <path d="M66 141c-13-34-13-75 10-101 18-21 43-29 67-23 30 7 47 30 49 65 1 22-3 42-10 61-7 18-17 28-31 34 6-32 10-67 5-94-4-26-19-40-42-41-23-1-36 14-40 40-3 22-1 47 3 71-4-2-8-6-11-12Z" fill="url(#hijab)"/>
  <path d="M75 48c17-24 45-31 68-23 17 6 28 18 34 34-17-8-32-15-52-16-18-1-34 2-50 5Z" fill="#2b2930" opacity=".75"/>
  <path d="M66 141c13 16 24 30 37 39-8 17-16 44-17 82-10 5-17 14-20 24 1-54 1-98 0-145Z" fill="#08070a" opacity=".4"/>

  <!-- neck -->
  <path d="M89 171h44v50c-7 7-16 11-23 11-10 0-17-4-23-12l2-49Z" fill="url(#neck)"/>
  <path d="M91 175c7 14 37 14 44-1v20c-10 10-33 10-43 0l-1-19Z" fill="#9f6c56" opacity=".55"/>

  <!-- face -->
  <path d="M78 117c0-34 14-55 36-55 24 0 38 22 38 57l-3 35c-2 25-17 42-36 42-20 0-34-17-36-43l1-36Z" fill="url(#skin)"/>
  <path d="M79 113c2-25 13-42 31-47-11 19-13 44-11 70 2 25 9 41 21 51-6 8-14 12-22 11-18-1-30-18-31-43l1-44Z" fill="#efc4a7" opacity=".26" filter="url(#soft)"/>
  <ellipse cx="90" cy="144" rx="14" ry="9" fill="url(#cheek)" filter="url(#tiny-soft)"/>
  <ellipse cx="138" cy="144" rx="14" ry="9" fill="url(#cheek)" filter="url(#tiny-soft)"/>

  <!-- hairline under scarf -->
  <path d="M82 111c1-27 13-43 32-46 20-3 34 13 38 41-9-14-20-22-34-23-16-1-27 9-36 28Z" fill="#3a2924" opacity=".78"/>

  <!-- brows and eyes -->
  <path d="M88 105c6-4 13-4 19-1M121 104c7-3 14-2 19 2" fill="none" stroke="#432824" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M88 115c5-4 12-4 18 0-3 8-10 9-18 0ZM121 115c6-4 13-4 18 0-4 9-11 8-18 0Z" fill="#f7e8dc" opacity=".9"/>
  <ellipse cx="98" cy="117" rx="4.2" ry="4.6" fill="#3b2722"/>
  <ellipse cx="130" cy="117" rx="4.2" ry="4.6" fill="#3b2722"/>
  <circle cx="98.7" cy="116.2" r="1.15" fill="#fff" opacity=".72"/>
  <circle cx="130.7" cy="116.2" r="1.15" fill="#fff" opacity=".72"/>
  <path d="M88 114c5-4 12-4 18 0M121 114c6-4 13-4 18 0" fill="none" stroke="#31201d" stroke-width="1.7" stroke-linecap="round"/>

  <!-- nose -->
  <path d="M110 123c-2 10-3 16 0 19 2 2 5 2 7 1" fill="none" stroke="#ad755f" stroke-width="1.7" stroke-linecap="round" opacity=".72"/>
  <path d="M107 143c4 2 8 2 12-1" fill="none" stroke="#bd836b" stroke-width="1.2" stroke-linecap="round" opacity=".7"/>

  <!-- mouth and chin -->
  <path d="M101 156c7-3 16-3 23 0-5 7-17 8-23 0Z" fill="url(#lip)"/>
  <path d="M103 157c6 2 12 2 18 0" fill="none" stroke="#613332" stroke-width="1" stroke-linecap="round" opacity=".55"/>
  <path d="M108 177c4 2 8 2 12 0" fill="none" stroke="#b77f69" stroke-width="1.4" stroke-linecap="round" opacity=".46"/>

  <!-- headscarf edge and folds -->
  <path d="M78 111c-2-30 11-49 34-52 24-3 40 15 42 49-5-21-17-33-37-34-23-1-34 14-39 37Z" fill="none" stroke="#4d4a51" stroke-width="1.2" opacity=".48"/>
  <path d="M70 123c-2-26 2-49 16-67M155 124c4-29 1-52-12-70" fill="none" stroke="#3f3c44" stroke-width="1.4" opacity=".5"/>
  <path d="M61 181c7 22 13 46 14 76M168 176c-4 20-10 44-15 72" fill="none" stroke="#33313a" stroke-width="2" opacity=".45"/>
  <path d="M113 39c22 1 39 13 43 36" fill="none" stroke="#4a474f" stroke-width="1.3" opacity=".36"/>
  <path d="M86 51c-8 21-8 47-3 72" fill="none" stroke="#3e3b43" stroke-width="1.1" opacity=".36"/>

  <!-- soft edges of the photograph -->
  <rect x="1" y="1" width="218" height="284" fill="none" stroke="#ffffff" stroke-opacity=".2" stroke-width="2"/>
</svg>
